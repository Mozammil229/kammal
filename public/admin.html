<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamaal Studio - Command Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Space Grotesk', sans-serif; background-color: #030712; color: #F8FAFC; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .app-glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .app-glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .glass-input { background: rgba(3, 7, 18, 0.85); border: 1px solid rgba(255, 255, 255, 0.12); }
        .glass-input:focus { border-color: #00E5FF; outline: none; box-shadow: 0 0 16px rgba(0, 229, 255, 0.25); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none bg-[#030712]">

    <!-- 1. PASSWORD LOCK SCREEN -->
    <div id="lockScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#030712]/95 backdrop-blur-2xl">
        <div class="w-full max-w-sm app-glass rounded-3xl p-6 border border-cyan-500/30 shadow-2xl space-y-6 text-center">
            <div class="mx-auto w-16 h-16 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-3xl">
                🛡️
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Kamaal Studio Core</h1>
                <p class="text-xs text-slate-400 mt-1">Authorized Administrator Access Only</p>
            </div>
            <div class="space-y-2 text-left">
                <label class="text-[11px] font-semibold text-slate-400 uppercase">Admin Password / Key:</label>
                <input id="loginAdminKey" type="password" placeholder="Enter password (e.g. ADmin)..." class="w-full glass-input text-sm rounded-xl px-4 py-3 text-white code-font" onkeydown="if(event.key==='Enter') verifyAndUnlockApp()">
                <p id="lockErrorMsg" class="text-xs text-rose-400 font-medium hidden">⚠️ Invalid Password!</p>
            </div>
            <button onclick="verifyAndUnlockApp()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-emerald-400 text-slate-950 font-bold text-sm rounded-xl shadow-lg active:scale-95 transition">
                🔓 Unlock Command Center
            </button>
        </div>
    </div>

    <!-- 2. MAIN APP UI -->
    <div id="mainAppUi" class="hidden flex-1 max-w-2xl mx-auto w-full flex flex-col pb-24">
        <header class="sticky top-0 z-40 app-glass border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <span class="text-sm font-bold text-white">Command Core</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="refreshCurrentTab()" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-lg text-xs">🔄</button>
                <button onclick="lockAdminScreen()" class="px-2.5 py-1 bg-rose-500/20 text-rose-300 rounded-lg text-xs font-bold">🔒 Lock</button>
            </div>
        </header>

        <div id="toast" class="hidden mx-4 mt-3 p-3 rounded-xl text-xs font-semibold"></div>

        <main class="flex-1 p-4 space-y-4">
            <!-- TAB 1: PROMPT -->
            <div id="tabPrompt" class="tab-view space-y-4">
                <div class="app-glass-card rounded-2xl p-4 border border-cyan-500/20 space-y-2">
                    <div class="flex justify-between text-xs font-bold text-cyan-400">
                        <span>Active Engine:</span>
                        <span id="activeModelBadge" class="code-font text-[10px] bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded border border-cyan-500/40">gemini-2.5-flash</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selectAiModel('gemini-3.1')" class="py-2 px-3 bg-slate-900 border border-slate-700 text-slate-300 rounded-xl text-xs text-left">gemini-3.1</button>
                        <button onclick="selectAiModel('gemini-2.5-flash')" class="py-2 px-3 bg-slate-900 border border-cyan-500/60 text-cyan-300 rounded-xl text-xs text-left">gemini-2.5-flash</button>
                    </div>
                </div>

                <div class="app-glass-card rounded-2xl p-4 border border-slate-800 space-y-2">
                    <div class="flex justify-between text-xs text-white font-bold">
                        <span>Global System Prompt:</span>
                        <button onclick="resetToFactoryDefault()" class="text-[10px] text-rose-400">Reset</button>
                    </div>
                    <textarea id="globalPromptInput" rows="6" class="w-full glass-input rounded-xl p-3 text-xs code-font text-slate-200"></textarea>
                    <button onclick="deployGlobalPrompt()" class="w-full py-2.5 bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-bold text-xs rounded-xl">
                        💾 Deploy Global Prompt
                    </button>
                </div>

                <!-- Test AI -->
                <div class="app-glass-card rounded-2xl p-4 border border-slate-800 space-y-2">
                    <label class="text-xs font-bold text-emerald-400">Test AI Output:</label>
                    <div class="flex gap-2">
                        <input id="testQueryInput" type="text" placeholder="Question..." class="glass-input text-xs rounded-xl px-3 py-2 flex-1 text-white">
                        <button onclick="runAiTest()" class="px-3 py-2 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-xs font-bold rounded-xl">Test ⚡</button>
                    </div>
                    <div id="testOutputBox" class="hidden rounded-xl p-3 bg-slate-950/80 text-xs code-font text-slate-300"></div>
                </div>
            </div>

            <!-- TAB 2: VIP PROMPT -->
            <div id="tabVip" class="tab-view hidden space-y-4">
                <div class="app-glass-card rounded-2xl p-4 border border-purple-500/30 space-y-3">
                    <h3 class="text-xs font-bold text-purple-300 uppercase">⭐ VIP / Per-User Custom Prompt</h3>
                    <div class="flex gap-2">
                        <input id="vipTargetUsername" type="text" placeholder="Username (e.g. mozammil)..." class="glass-input text-xs rounded-xl px-3 py-2 flex-1 text-white">
                        <button onclick="fetchVipUserPrompt()" class="px-3 py-2 bg-purple-600/30 text-purple-300 border border-purple-500/40 text-xs font-bold rounded-xl">Check</button>
                    </div>
                    <textarea id="vipPromptText" rows="5" placeholder="Enter private custom prompt for this user..." class="w-full glass-input text-xs rounded-xl p-3 text-slate-200 code-font"></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="saveVipCustomPrompt()" class="py-2 bg-purple-600 text-white font-bold text-xs rounded-xl">Save For User</button>
                        <button onclick="clearVipCustomPrompt()" class="py-2 bg-slate-800 text-rose-400 text-xs rounded-xl border border-rose-500/30">Revert Global</button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: USERS & HW LOCK -->
            <div id="tabUsers" class="tab-view hidden space-y-3">
                <input id="userSearchInput" oninput="loadUsersList()" type="text" placeholder="Search user or device ID..." class="w-full glass-input text-xs rounded-xl px-3.5 py-2.5 text-white">
                <div id="usersListContainer" class="space-y-2"></div>
            </div>

            <!-- TAB 4: FREEZE -->
            <div id="tabMaintenance" class="tab-view hidden space-y-4">
                <div class="app-glass-card rounded-2xl p-4 border border-amber-500/30 space-y-3">
                    <div class="flex items-center gap-2">
                        <span id="maintStatusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                        <span id="maintStatusBadge" class="text-xs font-bold text-emerald-400">🟢 NORMAL ACTIVE</span>
                    </div>
                    <input id="freezeNoticeInput" type="text" placeholder="Freeze broadcast message..." class="w-full glass-input text-xs rounded-xl px-3 py-2 text-white">
                    <button id="freezeToggleBtn" onclick="toggleEmergencyFreeze()" class="w-full py-3 bg-rose-600 text-white font-bold text-xs rounded-xl">
                        ❄️ FREEZE ENTIRE APP
                    </button>
                </div>
            </div>
        </main>

        <!-- BOTTOM APP NAVIGATION -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 app-glass border-t border-slate-800 max-w-2xl mx-auto px-2 py-2">
            <div class="grid grid-cols-4 gap-1">
                <button onclick="switchTab('tabPrompt')" id="nav-tabPrompt" class="nav-btn py-1.5 rounded-xl text-cyan-400 bg-cyan-500/10 text-xs font-bold flex flex-col items-center">
                    <span>🤖</span><span>Prompt</span>
                </button>
                <button onclick="switchTab('tabVip')" id="nav-tabVip" class="nav-btn py-1.5 rounded-xl text-slate-400 text-xs flex flex-col items-center">
                    <span>⭐</span><span>VIP</span>
                </button>
                <button onclick="switchTab('tabUsers')" id="nav-tabUsers" class="nav-btn py-1.5 rounded-xl text-slate-400 text-xs flex flex-col items-center">
                    <span>👥</span><span>Users</span>
                </button>
                <button onclick="switchTab('tabMaintenance')" id="nav-tabMaintenance" class="nav-btn py-1.5 rounded-xl text-slate-400 text-xs flex flex-col items-center">
                    <span>❄️</span><span>Freeze</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- LOGIC SCRIPT -->
    <script>
        let adminKey = localStorage.getItem('kamaal_admin_pwd') || '';
        let activeTab = 'tabPrompt';
        let defaultPrompt = '';
        let isAppFrozen = false;

        function showToast(msg, isErr=false) {
            const t = document.getElementById('toast');
            t.className = isErr ? 'mx-4 mt-3 p-3 rounded-xl text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/40 block' : 'mx-4 mt-3 p-3 rounded-xl text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 block';
            t.innerText = msg;
            setTimeout(() => t.className = 'hidden', 3500);
        }

        async function verifyAndUnlockApp() {
            const pwd = document.getElementById('loginAdminKey').value.trim();
            const err = document.getElementById('lockErrorMsg');
            if (!pwd) return;
            try {
                const res = await fetch('/api/admin/system-prompt', { headers: { 'x-admin-key': pwd } });
                const data = await res.json();
                if (data.success || pwd === 'ADmin') {
                    adminKey = pwd;
                    localStorage.setItem('kamaal_admin_pwd', pwd);
                    document.getElementById('lockScreen').classList.add('hidden');
                    document.getElementById('mainAppUi').classList.remove('hidden');
                    err.classList.add('hidden');
                    initializeApp();
                } else {
                    err.classList.remove('hidden');
                }
            } catch (e) {
                if (pwd === 'ADmin') {
                    adminKey = pwd;
                    localStorage.setItem('kamaal_admin_pwd', pwd);
                    document.getElementById('lockScreen').classList.add('hidden');
                    document.getElementById('mainAppUi').classList.remove('hidden');
                    initializeApp();
                } else {
                    err.classList.remove('hidden');
                }
            }
        }

        function lockAdminScreen() {
            localStorage.removeItem('kamaal_admin_pwd');
            adminKey = '';
            document.getElementById('mainAppUi').classList.add('hidden');
            document.getElementById('lockScreen').classList.remove('hidden');
        }

        function switchTab(id) {
            activeTab = id;
            document.querySelectorAll('.tab-view').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.className = 'nav-btn py-1.5 rounded-xl text-slate-400 text-xs flex flex-col items-center');
            document.getElementById(`nav-${id}`).className = 'nav-btn py-1.5 rounded-xl text-cyan-400 bg-cyan-500/10 text-xs font-bold flex flex-col items-center';
            if (id === 'tabUsers') loadUsersList();
            if (id === 'tabMaintenance') loadMaintenance();
        }

        function refreshCurrentTab() {
            if (activeTab === 'tabPrompt') { loadPrompt(); loadModel(); }
            if (activeTab === 'tabUsers') loadUsersList();
            if (activeTab === 'tabMaintenance') loadMaintenance();
            showToast('Refreshed 🔄');
        }

        async function loadPrompt() {
            try {
                const res = await fetch('/api/admin/system-prompt', { headers: { 'x-admin-key': adminKey } });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('globalPromptInput').value = data.systemPrompt;
                    defaultPrompt = data.defaultPrompt || '';
                }
            } catch (_) {}
        }

        function resetToFactoryDefault() {
            if (defaultPrompt) document.getElementById('globalPromptInput').value = defaultPrompt;
        }

        async function deployGlobalPrompt() {
            const prompt = document.getElementById('globalPromptInput').value.trim();
            const res = await fetch('/api/admin/system-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ systemPrompt: prompt })
            });
            const data = await res.json();
            showToast(data.message || 'Deployed');
        }

        async function loadModel() {
            const res = await fetch('/api/admin/model', { headers: { 'x-admin-key': adminKey } });
            const data = await res.json();
            if (data.success) document.getElementById('activeModelBadge').innerText = data.currentModel;
        }

        async function selectAiModel(m) {
            await fetch('/api/admin/model', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ model: m })
            });
            document.getElementById('activeModelBadge').innerText = m;
            showToast(`Active: ${m}`);
        }

        async function runAiTest() {
            const prompt = document.getElementById('globalPromptInput').value;
            const msg = document.getElementById('testQueryInput').value || "Test";
            showToast('Querying...');
            const res = await fetch('/api/admin/test-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ prompt, testMessage: msg })
            });
            const data = await res.json();
            const box = document.getElementById('testOutputBox');
            box.innerText = data.reply;
            box.classList.remove('hidden');
        }

        async function fetchVipUserPrompt() {
            const u = document.getElementById('vipTargetUsername').value.trim();
            if (!u) return;
            const res = await fetch(`/api/admin/user-prompt/${encodeURIComponent(u)}`, { headers: { 'x-admin-key': adminKey } });
            const data = await res.json();
            document.getElementById('vipPromptText').value = data.customPrompt || '';
            showToast(data.customPrompt ? `Loaded VIP prompt` : `Using Global Prompt`);
        }

        async function saveVipCustomPrompt() {
            const username = document.getElementById('vipTargetUsername').value.trim();
            const customPrompt = document.getElementById('vipPromptText').value.trim();
            const res = await fetch('/api/admin/user-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ username, customPrompt })
            });
            const data = await res.json();
            showToast(data.message);
        }

        async function clearVipCustomPrompt() {
            const username = document.getElementById('vipTargetUsername').value.trim();
            await fetch('/api/admin/user-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ username, customPrompt: "" })
            });
            document.getElementById('vipPromptText').value = '';
            showToast(`Reverted to global`);
        }

        async function loadUsersList() {
            const s = document.getElementById('userSearchInput')?.value || '';
            const res = await fetch(`/api/admin/users?search=${encodeURIComponent(s)}`, { headers: { 'x-admin-key': adminKey } });
            const data = await res.json();
            if (!data.success) return;
            document.getElementById('usersListContainer').innerHTML = data.users.map(u => `
                <div class="app-glass-card rounded-2xl p-3 border border-slate-800 space-y-2">
                    <div class="flex justify-between text-xs">
                        <strong class="text-white">${u.username} ${u.isPro ? '⭐' : ''}</strong>
                        <span class="text-emerald-400 font-bold">${u.credits} Coins</span>
                    </div>
                    <div class="text-[10px] text-slate-400">${u.deviceId || 'Unbound'}</div>
                    <div class="flex gap-1 overflow-x-auto text-[10px]">
                        ${u.deviceId ? `<button onclick="resetHw('${u.username}')" class="px-2 py-1 bg-amber-500/20 text-amber-300 rounded">🔓 Reset HW</button>` : ''}
                        <button onclick="addCoin('${u.username}')" class="px-2 py-1 bg-emerald-500/20 text-emerald-300 rounded">+10 Coins</button>
                    </div>
                </div>
            `).join('');
        }

        async function resetHw(username) {
            await fetch('/api/admin/reset-device', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ username })
            });
            loadUsersList();
            showToast('Device lock cleared');
        }

        async function addCoin(username) {
            await fetch('/api/admin/add-credits', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ username, amount: 10 })
            });
            loadUsersList();
            showToast('+10 coins added');
        }

        async function loadMaintenance() {
            const res = await fetch('/api/admin/maintenance');
            const data = await res.json();
            isAppFrozen = !!data.maintenance?.enabled;
            const badge = document.getElementById('maintStatusBadge');
            const btn = document.getElementById('freezeToggleBtn');
            if (isAppFrozen) {
                badge.innerText = '🔴 APP FROZEN';
                badge.className = 'text-xs font-bold text-rose-400';
                btn.innerText = '🔥 UNFREEZE APP';
                btn.className = 'w-full py-3 bg-emerald-600 text-white font-bold text-xs rounded-xl';
            } else {
                badge.innerText = '🟢 NORMAL ACTIVE';
                badge.className = 'text-xs font-bold text-emerald-400';
                btn.innerText = '❄️ FREEZE ENTIRE APP';
                btn.className = 'w-full py-3 bg-rose-600 text-white font-bold text-xs rounded-xl';
            }
        }

        async function toggleEmergencyFreeze() {
            const next = !isAppFrozen;
            const msg = document.getElementById('freezeNoticeInput').value;
            await fetch('/api/admin/maintenance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey },
                body: JSON.stringify({ enabled: next, message: msg })
            });
            loadMaintenance();
            showToast(next ? 'App Frozen' : 'App Restored');
        }

        function initializeApp() {
            loadPrompt();
            loadModel();
            loadUsersList();
            loadMaintenance();
        }

        if (adminKey) {
            document.getElementById('loginAdminKey').value = adminKey;
            verifyAndUnlockApp();
        }
    </script>
</body>
</html>
