<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kammal App — Command Core</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#030712;color:#f8fafc}
.glass{background:rgba(15,23,42,.78);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08)}
input,textarea{user-select:text} .scroll::-webkit-scrollbar{width:4px}.scroll::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}
</style>
</head>
<body class="min-h-screen">
<div id="lock" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
 <div class="glass rounded-3xl p-6 w-full max-w-sm space-y-4 text-center">
  <div class="text-4xl">🛡️</div><h1 class="text-xl font-black">Kammal Command Core</h1>
  <input id="key" type="password" placeholder="Admin security key" class="w-full bg-slate-950 border border-slate-700 rounded-2xl p-3">
  <button onclick="unlock()" class="w-full py-3 rounded-2xl bg-cyan-500 text-slate-950 font-black">Unlock</button>
  <p id="err" class="text-xs text-rose-400"></p>
 </div>
</div>

<main id="app" class="hidden max-w-3xl mx-auto p-4 pb-16">
<header class="glass sticky top-2 z-30 rounded-2xl p-4 mb-4 flex justify-between items-center">
 <div><b>Kammal App</b><div class="text-[10px] text-emerald-400">ADMIN • ONLINE</div></div>
 <button onclick="location.reload()" class="text-xs px-3 py-2 rounded-xl bg-slate-800">Refresh</button>
</header>

<nav class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-2xl mb-4">
 <button onclick="tab('ai')" class="tab py-2 rounded-xl text-xs">🧠 AI</button>
 <button onclick="tab('users')" class="tab py-2 rounded-xl text-xs">👥 Users</button>
 <button onclick="tab('chat')" class="tab py-2 rounded-xl text-xs">💬 Chats</button>
 <button onclick="tab('system')" class="tab py-2 rounded-xl text-xs">⚙️ System</button>
</nav>

<section id="ai" class="space-y-4">
 <div class="glass rounded-2xl p-4 space-y-3">
  <h2 class="font-bold">Global AI Prompt</h2>
  <textarea id="globalPrompt" rows="7" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm"></textarea>
  <button onclick="saveGlobal()" class="w-full py-3 rounded-xl bg-cyan-500 text-slate-950 font-bold">Save Global Prompt</button>
 </div>
 <div class="glass rounded-2xl p-4 space-y-3">
  <h2 class="font-bold">Custom User Prompt</h2>
  <div class="flex gap-2"><input id="promptUser" placeholder="username" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3"><button onclick="loadPrompt()" class="px-4 rounded-xl bg-purple-600">Load</button></div>
  <textarea id="customPrompt" rows="7" placeholder="This prompt applies only to this user..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm"></textarea>
  <div class="grid grid-cols-2 gap-2"><button onclick="savePrompt()" class="py-3 rounded-xl bg-purple-600 font-bold">Save / Re-edit</button><button onclick="clearPrompt()" class="py-3 rounded-xl bg-slate-800">Use Global</button></div>
 </div>
</section>

<section id="users" class="hidden space-y-4">
 <input id="search" oninput="loadUsers()" placeholder="Search username..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3">
 <div id="usersList" class="space-y-2"></div>
</section>

<section id="chat" class="hidden space-y-3">
 <div class="glass rounded-2xl p-4">
  <h2 class="font-bold mb-3">👑 Owner / Admin Inbox</h2>
  <input id="chatSearch" oninput="loadChatUsers()" placeholder="Search user to message..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 mb-3">
  <div id="chatUsers" class="space-y-2"></div>
 </div>
 <div id="chatBox" class="hidden glass rounded-2xl p-4">
  <div class="flex justify-between"><b id="chatTitle">Owner Chat</b><button onclick="closeChat()">✕</button></div>
  <div id="messages" class="scroll h-72 overflow-y-auto space-y-2 py-3"></div>
  <div class="flex gap-2"><input id="msg" maxlength="4000" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3" placeholder="Type a message..."><button onclick="sendOwnerMessage()" class="px-4 rounded-xl bg-cyan-500 text-slate-950 font-bold">Send</button></div>
 </div>
</section>

<section id="system" class="hidden space-y-4">
 <div class="glass rounded-2xl p-4 space-y-3">
  <h2 class="font-bold">Plans & Credits</h2>
  <p class="text-xs text-slate-400">Owner is protected at 9,999,999 credits and Lifetime.</p>
  <div class="text-sm bg-slate-950 rounded-xl p-3">Supported: Free • Monthly • Yearly • Lifetime • Custom</div>
 </div>
 <div class="glass rounded-2xl p-4 space-y-3">
  <h2 class="font-bold">Maintenance</h2>
  <textarea id="maint" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></textarea>
  <div class="grid grid-cols-2 gap-2"><button onclick="maintenance(true)" class="py-3 rounded-xl bg-rose-600">Freeze</button><button onclick="maintenance(false)" class="py-3 rounded-xl bg-emerald-600">Resume</button></div>
 </div>
</section>
</main>

<script>
let key=localStorage.getItem("kammal_admin_key")||"", selectedUser=null;
const $=id=>document.getElementById(id);
async function api(url,opt={}){
  const headers={...(opt.headers||{}),"x-admin-key":key};
  const r=await fetch(url,{...opt,headers,cache:"no-store"});
  let d={};
  try{d=await r.json()}catch{}
  if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);
  return d;
}
async function unlock(){
  const entered=$("key").value.trim();
  if(!entered){$("err").textContent="Enter admin key";return}
  key=entered;
  $("err").textContent="Checking…";
  try{
    await api("/api/admin/verify");
    localStorage.setItem("kammal_admin_key",key);
    $("lock").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("err").textContent="";
    await loadAll();
  }catch(e){
    $("err").textContent=e.message||"Invalid admin key";
    $("lock").classList.remove("hidden");
    $("app").classList.add("hidden");
  }
} 
function tab(id){["ai","users","chat","system"].forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="users")loadUsers();if(id==="chat")loadChatUsers();if(id==="system")loadMaintenance()}
async function loadAll(){try{const d=await api("/api/admin/system-prompt");$("globalPrompt").value=d.systemPrompt||""}catch(e){}loadUsers()}
async function saveGlobal(){await api("/api/admin/system-prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemPrompt:$("globalPrompt").value})});alert("Global prompt saved")}
async function loadPrompt(){const u=$("promptUser").value.trim();if(!u)return;const d=await api("/api/admin/user-prompt/"+encodeURIComponent(u));$("customPrompt").value=d.customPrompt||""}
async function savePrompt(){const u=$("promptUser").value.trim();await api("/api/admin/user-prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,customPrompt:$("customPrompt").value})});alert("Custom prompt saved")}
async function clearPrompt(){$("customPrompt").value="";await savePrompt()}
async function loadUsers(){try{const d=await api("/api/admin/users?search="+encodeURIComponent($("search").value||""));$("usersList").innerHTML=(d.users||[]).map(u=>`
<div class="glass rounded-2xl p-4">
 <div class="flex justify-between items-center"><div><b>${esc(u.username)}</b>${u.owner?' <span class="text-amber-300 font-bold">👑 Owner</span>':''} ${u.isPro?'<span class="text-amber-300 text-xs">PRO</span>':''}</div><b class="text-cyan-300">${u.credits}</b></div>
 <div class="text-xs text-slate-400 mt-2">Plan: ${u.planType} • ${u.planStatus}</div>
 <div class="flex flex-wrap gap-2 mt-3">
 <button class="px-3 py-2 rounded-lg bg-cyan-500/20 text-cyan-300 text-xs" onclick="give('${encodeURIComponent(u.realUsernameHidden?'':u.username)}')">+20</button>
 <button class="px-3 py-2 rounded-lg bg-purple-500/20 text-purple-300 text-xs" onclick="plan('${encodeURIComponent(u.realUsernameHidden?'':u.username)}','monthly')">Monthly</button>
 <button class="px-3 py-2 rounded-lg bg-purple-500/20 text-purple-300 text-xs" onclick="plan('${encodeURIComponent(u.realUsernameHidden?'':u.username)}','yearly')">Yearly</button>
 <button class="px-3 py-2 rounded-lg bg-amber-500/20 text-amber-300 text-xs" onclick="plan('${encodeURIComponent(u.realUsernameHidden?'':u.username)}','lifetime')">Lifetime</button>
 <button class="px-3 py-2 rounded-lg bg-slate-800 text-xs" onclick="openUserPrompt('${encodeURIComponent(u.realUsernameHidden?'':u.username)}')">Prompt</button>
 </div>
</div>`).join("")||"<p class='text-slate-500'>No users.</p>"}catch(e){$("usersList").innerHTML="<p class='text-rose-400'>"+esc(e.message)+"</p>"}}
async function give(u){if(!u)return alert("Owner is protected.");await api("/api/admin/add-credits",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:decodeURIComponent(u),amount:20})});loadUsers()}
async function plan(u,type){if(!u)return alert("Owner is already Lifetime.");await api("/api/admin/set-plan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:decodeURIComponent(u),planType:type})});loadUsers()}
function openUserPrompt(u){if(!u)return;tab("ai");$("promptUser").value=decodeURIComponent(u);loadPrompt()}
async function loadChatUsers(){try{const d=await api("/api/admin/chat/users?search="+encodeURIComponent($("chatSearch").value||""));$("chatUsers").innerHTML=(d.users||[]).map(u=>`<button onclick="openChat('${u.id}','${esc(u.username)}')" class="w-full text-left glass rounded-xl p-3"><b>${u.owner?'👑 Owner':esc(u.username)}</b><span class="text-xs text-slate-500 ml-2">${u.planType}</span></button>`).join("")}catch(e){}}
async function openChat(id,name){selectedUser=id;$("chatBox").classList.remove("hidden");$("chatTitle").textContent="👑 Owner → "+name;$("messages").innerHTML="<div class='text-slate-500 text-sm'>Use Send to start this conversation.</div>"}
async function sendOwnerMessage(){if(!selectedUser)return;const text=$("msg").value.trim();if(!text)return;await api("/api/admin/chat/"+selectedUser+"/message",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});$("messages").insertAdjacentHTML("beforeend",`<div class="ml-auto max-w-[85%] bg-cyan-600/20 border border-cyan-500/30 rounded-2xl p-3 text-sm"><b>Owner</b><div>${esc(text)}</div></div>`);$("msg").value=""}
function closeChat(){$("chatBox").classList.add("hidden");selectedUser=null}
async function loadMaintenance(){try{const d=await api("/api/admin/maintenance");$("maint").value=d.maintenance?.message||""}catch(e){}}
async function maintenance(enabled){await api("/api/admin/maintenance",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled,message:$("maint").value})});alert(enabled?"Frozen":"Resumed")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(key){$("key").value=key;unlock()}
</script>
</body>
</html>
